  - [21, 1, Index, [256, 2]]

  - [24, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
