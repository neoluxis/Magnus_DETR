  - [-1, 1, MDHIFI, [256, 2048, 8, 3, 5, 4]]
  - [12, 1, Conv, [256, 1, 1, null, 1, 1, False]]

  # args: cm, smooth_kernel, align_mode, noise_suppression, p3_gate, placement, gamma_init
  - [[19, 17, 15], 1, HFSCCPlacement, [4, 3, shift, False, True, correction, 0.01]]
  - [21, 1, Index, [256, 0]]
