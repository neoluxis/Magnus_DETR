# Historical b5 architecture with an equation-exact HF-SCC placement switch.
# train.py rewrites the placement and TorchVision weight source per run.
nc: 1
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, TorchVision, [768, swin_v2_t, DEFAULT, True, 2, True]]
  - [0, 1, Index, [192, 3]]
  - [-1, 1, Permute, [0, 3, 1, 2]]
  - [-1, 1, EMA, [192, 192]]
  - [0, 1, Index, [384, 5]]
  - [-1, 1, Permute, [0, 3, 1, 2]]
  - [-1, 1, EMA, [384, 384]]
  - [0, 1, Index, [768, 7]]
  - [-1, 1, Permute, [0, 3, 1, 2]]
  - [-1, 1, EMA, [768, 768]]
  - [0, 1, Index, [96, 1]]
  - [-1, 1, Permute, [0, 3, 1, 2]]
  - [-1, 1, EMA, [96, 96]]

head:
  - [9, 1, Conv, [256, 1, 1, null, 1, 1, False]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]

  - [6, 1, Conv, [256, 1, 1, null, 1, 1, False]]
